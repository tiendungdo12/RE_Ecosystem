protocol_version: "2025-11-25"

tools:
  - id: "static.md5"
    name: "MD5 File Hasher"
    cluster: "MCP_Static_Analysis"
    transport: "stdio"
    runtime: "python"
    working_directory: "Tools/MCP_Static_Analysis/MCP_Unified"
    command: "Tools/Python_Runtime/python.exe"
    args:
      - "server.py"
    capabilities:
      - "hash.file.md5"
    enabled: true
    notes: "Block 2.2 MCP SDK stdio server. raw_stdio_server.py is kept as the Block 2.1 protocol lab."

  - id: "static.triage"
    name: "Static Triage"
    cluster: "MCP_Static_Analysis"
    transport: "stdio"
    runtime: "python"
    working_directory: "Tools/MCP_Static_Analysis/MCP_Unified"
    command: "Tools/Python_Runtime/python.exe"
    args:
      - "server.py"
    capabilities:
      - "triage.file.basic"
      - "hash.file.md5"
      - "hash.file.sha256"
      - "detect.file.magic"
      - "measure.file.entropy"
    enabled: true
    notes: "Block 3.1 stdlib triage MCP server. LIEF/DIE integrations will be added in later Block 3 steps."
